        const ReorderModal = ({ isOpen, onClose, allItems, onReorder, currentCategory, onSave }) => {

            if (!isOpen) return null;

                e.preventDefault();
                if (draggedItem === null || draggedItem === dropIndex) return;
                const newFiltered = [...filteredItems];

                    const item = newAllItems[i];

        const AdminPanel = ({ isOpen, onClose, onSaveItem, onLogout, allItems, editingItem, onDownload, onOpenReorder, currentCategory }) => {

            const [itemData, setItemData] = useState({ type: 'image', url: '', referenceUrl: '', title: '', description: '', date: new Date().toLocaleDateString(), subCategory: '기타' });

                    else setPreviewUrl(editingItem.url);
                } else {
                    setItemData({ type: 'image', url: '', referenceUrl: '', title: '', description: '', date: new Date().toLocaleDateString(), subCategory: '기타' });
                    setPreviewUrl('');
                }
            }, [editingItem, isOpen]);

            if (!isOpen) return null;

            const handleUrlChange = (e) => {
                const rawUrl = e.target.value;
                let type = itemData.type;
                let preview = '';
                if (rawUrl.includes('youtube') || rawUrl.includes('youtu.be')) type = 'video';
                if (rawUrl.includes('drive.google.com')) preview = convertGoogleDriveLink(rawUrl);
                else if (rawUrl.includes('youtube') || rawUrl.includes('youtu.be')) {

                <div className="fixed inset-0 z-[100] flex items-center justify-center p-0 md:p-4">
                    <div className="absolute inset-0 bg-white/80 backdrop-blur-md" onClick={onClose}></div>
                    <div className="relative w-full h-full md:h-auto md:max-w-2xl bg-white md:rounded-2xl flex flex-col max-h-[100vh] md:max-h-[90vh] shadow-2xl modern-border">
                        <div className="p-6 md:p-8 border-b modern-border flex justify-between items-center bg-luxury-light md:rounded-t-2xl pt-safe-top">
                            <h2 className="text-xl text-luxury-black font-trendy flex items-center gap-2 font-bold"><Lock size={18} className="text-luxury-gold"/> 관리자 대시보드</h2>
                            <button onClick={onClose} className="text-luxury-gray hover:text-luxury-black p-2"><XIcon size={24} /></button>
                        </div>
                        <div className="flex border-b modern-border bg-white">
                            <button onClick={() => setActiveTab('edit')} className={`flex-1 py-4 text-xs md:text-sm font-bold tracking-widest uppercase transition-colors ${activeTab === 'edit' ? 'text-luxury-black border-b-2 border-luxury-black' : 'text-luxury-gray hover:text-luxury-black hover:bg-luxury-light'}`}> {editingItem ? '수정' : '추가'} </button>
                            <button onClick={() => setActiveTab('order')} className={`flex-1 py-4 text-xs md:text-sm font-bold tracking-widest uppercase transition-colors ${activeTab === 'order' ? 'text-luxury-black border-b-2 border-luxury-black' : 'text-luxury-gray hover:text-luxury-black hover:bg-luxury-light'}`}> 순서 관리 </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 md:p-8 bg-white pb-32 md:pb-8">
                            {activeTab === 'edit' ? (
                                <div className="space-y-6">
                                     <div className="mb-4 p-5 bg-luxury-light modern-border rounded-lg flex items-center justify-between">
                                        <div className="text-sm text-luxury-black">
                                            <span className="font-bold block mb-1">구글 드라이브</span>
                                            <span className="text-xs text-luxury-gray">미디어 업로드 및 링크 복사</span>
                                        </div>
                                        <a href={userDriveFolder} target="_blank" rel="noreferrer" className="bg-luxury-black hover:bg-luxury-dark text-white p-3 rounded-full transition-colors flex items-center justify-center shadow-md active:scale-95"><Plus size={18} /></a>
                                    </div>
                                    <form onSubmit={handleSubmit} className="space-y-5">
                                        <div>
                                            <label className="block text-xs text-luxury-gold uppercase tracking-widest mb-1.5 font-bold">메인 미디어 링크</label>
                                            <input type="text" required placeholder="링크 (Drive / YouTube)" value={itemData.url} onChange={handleUrlChange} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black focus:outline-none focus:ring-1 focus:ring-luxury-black focus:border-luxury-black transition-all text-sm appearance-none" />
                                            {previewUrl && (<div className="mt-3 w-32 bg-white rounded-lg modern-border overflow-hidden relative shadow-sm"><div className="aspect-video w-full flex items-center justify-center"><img src={previewUrl} alt="Preview" className="h-full w-full object-cover" onError={(e) => {e.target.style.display='none'}} /></div></div>)}
                                        </div>
                                        <div className="grid grid-cols-2 gap-5">
                                            <div>
                                                <label className="block text-xs text-luxury-gray uppercase tracking-widest mb-1.5 font-bold">분류 (대분류)</label>
                                                <div className="relative">
                                                    <select value={itemData.type} onChange={(e) => setItemData({...itemData, type: e.target.value, subCategory: SUB_CATEGORIES[e.target.value][1]})} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black focus:outline-none focus:border-luxury-black text-sm appearance-none">
                                                        <option value="image">이미지 (Image & GIF)</option>
                                                        <option value="video">비디오 (Video)</option>
                                                    </select>
                                                    <div className="absolute right-4 top-4 pointer-events-none text-luxury-gray"><ArrowDown size={14}/></div>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-luxury-gray uppercase tracking-widest mb-1.5 font-bold">속성 (소분류)</label>
                                                <div className="relative">
                                                    <select value={itemData.subCategory} onChange={(e) => setItemData({...itemData, subCategory: e.target.value})} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black focus:outline-none focus:border-luxury-black text-sm appearance-none">
                                                        {availableSubCategories.map(cat => (
                                                            <option key={cat} value={cat}>{cat}</option>
                                                        ))}
                                                    </select>
                                                    <div className="absolute right-4 top-4 pointer-events-none text-luxury-gray"><ArrowDown size={14}/></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-luxury-gray uppercase tracking-widest mb-1.5 font-bold">제목</label>
                                            <input type="text" required value={itemData.title} onChange={(e) => setItemData({...itemData, title: e.target.value})} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black focus:outline-none focus:border-luxury-black text-sm font-gothic font-bold appearance-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-luxury-gray uppercase tracking-widest mb-1.5 font-bold">설명</label>
                                            <textarea rows="4" required value={itemData.description} onChange={(e) => setItemData({...itemData, description: e.target.value})} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black focus:outline-none focus:border-luxury-black resize-none text-sm font-gothic appearance-none" />
                                        </div>
                                        <button type="submit" disabled={isProcessing} className="w-full bg-luxury-black hover:bg-luxury-dark text-white font-bold py-5 rounded-lg transition-colors flex justify-center items-center gap-2 text-sm uppercase tracking-wider mt-6 shadow-xl active:scale-95">
                                            {isProcessing ? <Loader className="animate-spin" size={18} /> : (editingItem ? <Edit2 size={18}/> : <Plus size={18} />)} 
                                            {editingItem ? '수정 완료' : '갤러리에 추가'}
                                        </button>
                                    </form>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col">
                                    <div className="mb-6 flex justify-between items-center bg-luxury-light modern-border p-5 rounded-lg">
                                         <div><h3 className="font-bold text-luxury-black text-sm">순서 편집</h3><p className="text-xs text-luxury-gray mt-1">목록을 드래그하여 순서를 바꿉니다.</p></div>
                                         <button onClick={onOpenReorder} className="bg-white hover:bg-gray-50 text-luxury-black px-5 py-2.5 rounded-lg text-xs font-bold shadow-sm flex items-center gap-2 active:scale-95 modern-border"><Maximize size={14}/> 전체 화면</button>
                                    </div>
                                    <div className="space-y-3">
                                        <p className="text-xs text-luxury-gray mb-3 font-trendy text-center">현재 카테고리 항목 ({filteredItems.length})</p>
                                        {filteredItems.map((item, index) => (
                                            <div key={item.id} className="flex items-center justify-between bg-white p-4 rounded-lg modern-border shadow-sm">
                                                <div className="flex items-center gap-4 overflow-hidden pointer-events-none">
                                                    <div className="w-12 h-12 bg-luxury-light rounded overflow-hidden flex-shrink-0 modern-border"><img src={item.thumbnail || item.url} className="w-full h-full object-cover" /></div>
                                                    <div className="min-w-0"><p className="text-luxury-black text-sm font-gothic font-bold truncate">{item.title}</p><p className="text-xs text-luxury-gold uppercase tracking-wider font-bold mt-0.5">{item.subCategory || item.type}</p></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="p-5 bg-luxury-light modern-border-bottom flex gap-3 absolute bottom-0 left-0 right-0 md:relative pb-safe md:rounded-b-2xl">
                            <button onClick={onDownload} className="flex-1 py-4 bg-luxury-black hover:bg-luxury-dark text-white rounded-lg font-trendy text-xs font-bold transition-colors shadow-lg flex items-center justify-center gap-2 uppercase tracking-widest active:scale-95"><UploadCloud size={18}/> 구글 드라이브 덮어쓰기 (저장)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // [Data Initialization] Auto-tagging logic based on title
            const initializeData = (data) => {
                return data.map(item => {
                    if (item.subCategory) return item; // Already tagged
                    
                    const title = (item.title || '').toLowerCase().replace(/\s+/g, '');
                    let category = '기타';
                    
                    if (item.type === 'video') {
                        if (title.includes('기획영상') || title.includes('기획')) category = '기획영상';
                        else if (title.includes('편집영상') || title.includes('편집')) category = '편집영상';
                        else if (title.includes('ai') || title.includes('에이아이')) category = 'AI영상';
                        else if (title.includes('모션') || title.includes('그래픽')) category = '모션그래픽';
                    } else {
                        if (title.includes('상세페이지')) category = '상세페이지';
                        else if (title.includes('썸네일')) category = '썸네일';
                        else if (title.includes('sns')) category = 'SNS콘텐츠';
                        else if (title.includes('gif') || title.includes('움짤')) category = '상세페이지'; // GIF usually part of detail
                    }
                    return { ...item, subCategory: category };
                });
            };

            const [items, setItems] = useState(initializeData(INITIAL_DATA));
            const [selectedItem, setSelectedItem] = useState(null);
            const [editingItem, setEditingItem] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showAdminPanel, setShowAdminPanel] = useState(false);
            const [showReorderModal, setShowReorderModal] = useState(false); 
            const [password, setPassword] = useState('');
            const [category, setCategory] = useState('all'); 
            const [subCategoryFilter, setSubCategoryFilter] = useState('전체보기');
            
            // [Sorting Logic]
            const getSortedItems = (data) => {
                return [...data].sort((a, b) => {
                    const titleA_Clean = (a.title || '').toLowerCase().replace(/\s+/g, '');
                    const titleB_Clean = (b.title || '').toLowerCase().replace(/\s+/g, '');
                    const titleA_Raw = (a.title || '').toLowerCase();
                    const titleB_Raw = (b.title || '').toLowerCase();

                    const isPriorityZero = (t) => t.includes('기획영상') || t.includes('편집영상');
                    const p0A = isPriorityZero(titleA_Clean);
                    const p0B = isPriorityZero(titleB_Clean);
                    
                    if (p0A && !p0B) return -1;
                    if (!p0A && p0B) return 1;
                    if (p0A && p0B) return 0;

                    const isPriorityOne = (t) => t.includes('ai');
                    const p1A = isPriorityOne(titleA_Raw);
                    const p1B = isPriorityOne(titleB_Raw);
                    
                    if (p1A && !p1B) return -1;
                    if (!p1A && p1B) return 1;

                    return 0;
                });
            };
            
            // Sort items initially and when items change
            const sortedItems = useMemo(() => getSortedItems(items), [items]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === '@jjongkim0922') {
                    setIsAdmin(true); setShowLogin(false); setPassword(''); alert("환영합니다, 디렉터님.");
                } else { alert("접근이 거부되었습니다."); }
            };

            const handleSaveItem = (itemToSave, skipClose = false) => {
                const existingIndex = items.findIndex(i => i.id === itemToSave.id);
                let updatedItems;
                if (existingIndex > -1) { updatedItems = [...items]; updatedItems[existingIndex] = itemToSave; } 
                else { updatedItems = [itemToSave, ...items]; }
                setItems(updatedItems);
                if(!skipClose) setEditingItem(null); 
            };

            const handleReorder = (newOrder) => { setItems(newOrder); };
            const handleEditClick = (item) => { setEditingItem(item); setShowAdminPanel(true); };
            const handleDeleteItem = (e, id) => { if (window.confirm("정말로 이 항목을 컬렉션에서 영구 삭제하시겠습니까?")) { setItems(items.filter(item => item.id !== id)); } };

            const filteredItems = sortedItems.filter(item => {
                if (category === 'all') return true;
                if (item.type !== category) return false;
                if (subCategoryFilter === '전체보기') return true;
                return item.subCategory === subCategoryFilter;
            });

            const handleMoveItem = (itemId, direction) => {
                const currentList = [...filteredItems];
                const currentIndex = currentList.findIndex(item => item.id === itemId);
                if (currentIndex === -1) return;
                let targetIndex = -1;
                if (direction === 'prev' && currentIndex > 0) targetIndex = currentIndex - 1;
                if (direction === 'next' && currentIndex < currentList.length - 1) targetIndex = currentIndex + 1;
                if (targetIndex === -1) return;
                const itemA = currentList[currentIndex];
                const itemB = currentList[targetIndex];
                const newItems = [...items];
                const indexA = newItems.findIndex(i => i.id === itemA.id);
                const indexB = newItems.findIndex(i => i.id === itemB.id);
                [newItems[indexA], newItems[indexB]] = [newItems[indexB], newItems[indexA]];
                setItems(newItems);
            };

            const downloadPortfolio = () => {
                const currentDataString = JSON.stringify(items, null, 2);
                let htmlContent = document.documentElement.outerHTML;
                
                // 데이터 마커를 찾아서 교체 (g 플래그 사용)
                const regex = /(\/\*__DATA_START__\*\/)([\s\S]*?)(\/\*__DATA_END__\*\/)/g;
                if (!regex.test(htmlContent)) { alert("시스템 오류: 원본 코드의 데이터 마커를 찾을 수 없어 저장에 실패했습니다."); return; }
                
                htmlContent = htmlContent.replace(regex, (match, startMarker, oldContent, endMarker) => { return `${startMarker}${currentDataString}${endMarker}`; });
                
                // 루트 요소 초기화 (현재 상태의 HTML이 아닌 빈 상태로 저장)
                htmlContent = htmlContent.replace(/<div id="root">[\s\S]*?<\/div>/, '<div id="root"></div>');
                
                if (!htmlContent.trim().toLowerCase().startsWith('<!doctype html>')) { htmlContent = '<!DOCTYPE html>\n' + htmlContent; }
                
                const filename = `최적화_포트폴리오_김민종.html`;
                const userDriveFolder = "https://drive.google.com/drive/folders/1_Cb8v99dAXDfNanUxXX0PlLMvZTonVkN";
                if (window.confirm(`[자동 저장 시스템]\n\n1. 파일이 다운로드됩니다.\n2. 구글 드라이브 폴더가 자동으로 열립니다.\n3. 열린 구글 드라이브 화면에 다운로드된 파일을 드래그해서 놓아주세요.\n\n진행하시겠습니까?`)) {
                    try {
                        const blob = new Blob([htmlContent], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
                        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                        setTimeout(() => { window.open(userDriveFolder, '_blank'); }, 1500);
                    } catch (err) { console.error(err); alert("파일 저장 중 오류가 발생했습니다."); }
                }
            };

            return (
                <div className="min-h-screen bg-[#F4F5F7] text-luxury-black selection:bg-luxury-gold/30 font-sans">
                    <Hero />

                    <div className="sticky top-0 z-30 bg-[#F4F5F7]/90 backdrop-blur-xl modern-border-bottom py-3 pt-safe-top shadow-sm">
                        <div className="flex flex-col items-center gap-3">
                            {/* Main Tabs */}
                            <div className="flex justify-center gap-8 md:gap-16 px-4 overflow-x-auto hide-scrollbar w-full">
                                {['all', 'video', 'image'].map((cat) => (
                                    <button 
                                        key={cat}
                                        onClick={() => { setCategory(cat); setSubCategoryFilter('전체보기'); }}
                                        className={`relative py-3 text-xs md:text-sm font-trendy tracking-[0.2em] uppercase transition-colors duration-300 whitespace-nowrap flex-shrink-0 ${category === cat ? 'text-luxury-black font-bold' : 'text-luxury-gray hover:text-luxury-black'}`}
                                    >
                                        {cat === 'image' ? 'Image & GIF' : cat}
                                        {category === cat && <span className="absolute -bottom-0 left-0 w-full h-[2.5px] bg-luxury-black tab-indicator rounded-t-md"></span>}
                                    </button>
                                ))}
                            </div>
                            
                            {/* Sub Filter Buttons (Visible only when specific category selected) */}
                            {category !== 'all' && (
                                <div className="flex gap-2 px-4 pb-2 overflow-x-auto hide-scrollbar w-full justify-center animate-in slide-in-from-top-2 fade-in duration-300">
                                    {SUB_CATEGORIES[category].map((subCat) => (
                                        <button
                                            key={subCat}
                                            onClick={() => setSubCategoryFilter(subCat)}
                                            className={`px-4 py-1.5 rounded-full text-[10px] md:text-xs font-gothic transition-all whitespace-nowrap modern-border ${subCategoryFilter === subCat ? 'bg-luxury-black text-white font-bold' : 'bg-white text-luxury-gray hover:bg-luxury-light hover:text-luxury-black'}`}
                                        >
                                            {subCat}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="max-w-[2000px] mx-auto px-4 sm:px-8 py-16 md:py-20 min-h-[50vh]">
                        <GalleryGrid 
                            items={filteredItems} 
                            isAdmin={isAdmin} 
                            onDelete={handleDeleteItem} 
                            onEdit={handleEditClick} 
                            onItemClick={setSelectedItem} 
                            onMove={handleMoveItem}
                        />
                    </div>

                    <footer className="py-24 bg-white modern-border-bottom text-center px-4 mt-20 pb-safe">
                        <h3 className="font-luxury italic text-2xl mb-4 text-luxury-black font-black tracking-tighter">MinJong's Gallery</h3>
                        <p className="text-luxury-gray text-xs font-trendy tracking-widest uppercase opacity-70">© {new Date().getFullYear()} Designed with Absolute Precision.</p>
                    </footer>
                    
                    <Modal item={selectedItem} onClose={() => setSelectedItem(null)} />

                    <AdminPanel 
                        isOpen={showAdminPanel} 
                        onClose={() => setShowAdminPanel(false)} 
                        onSaveItem={handleSaveItem} 
                        onLogout={() => {setIsAdmin(false); setShowAdminPanel(false);}}
                        allItems={items}
                        editingItem={editingItem}
                        onDownload={downloadPortfolio}
                        onOpenReorder={() => setShowReorderModal(true)}
                        onReorder={handleReorder}
                        currentCategory={category}
                    />

                    <ReorderModal 
                        isOpen={showReorderModal}
                        onClose={() => setShowReorderModal(false)}
                        allItems={items}
                        onReorder={handleReorder}
                        onSave={downloadPortfolio} 
                        currentCategory={category}
                    />

                    {isAdmin ? (
                        <div className="fixed bottom-8 right-8 z-40 flex flex-col gap-4 animate-in fade-in slide-in-from-bottom-4 mb-safe-bottom">
                            <button onClick={() => { setEditingItem(null); setShowAdminPanel(true); }} className="bg-luxury-black text-white p-4 rounded-full shadow-2xl hover:bg-luxury-dark hover:scale-110 transition-all duration-300 group" title="Admin Dashboard"><Plus size={24} /></button>
                            <button onClick={downloadPortfolio} className="bg-white text-luxury-black p-3 rounded-full shadow-xl modern-border flex items-center justify-center hover:bg-luxury-light transition-all" title="Save to Drive"><UploadCloud size={18} /></button>
                            <button onClick={() => { setIsAdmin(false); setShowAdminPanel(false); alert("로그아웃 되었습니다."); }} className="bg-white text-red-500 p-3 rounded-full shadow-xl modern-border flex items-center justify-center hover:bg-red-50 transition-all" title="Logout"><LogOut size={18} /></button>
                        </div>
                    ) : (
                        <button onClick={() => setShowLogin(true)} className="fixed bottom-4 right-4 z-40 text-luxury-gray hover:text-luxury-black transition-colors duration-500 opacity-50 hover:opacity-100 p-2 mb-safe-bottom"><Lock size={16} /></button>
                    )}

                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-white/90 backdrop-blur-xl" onClick={() => setShowLogin(false)}></div>
                            <div className="relative bg-white p-10 md:p-12 modern-border shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-300 rounded-2xl">
                                <h3 className="text-center text-luxury-black font-trendy text-xl mb-8 uppercase tracking-widest font-black">Curator Access</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-luxury-light modern-border rounded-lg p-4 text-luxury-black text-center tracking-[0.5em] font-bold focus:border-luxury-black focus:ring-1 focus:ring-luxury-black outline-none mb-8 text-xl placeholder-luxury-gray appearance-none shadow-inner" placeholder="••••" autoFocus />
                                    <button type="submit" className="w-full bg-luxury-black hover:bg-luxury-dark text-white py-4 rounded-lg font-trendy text-sm transition-colors uppercase tracking-widest shadow-xl active:scale-95 font-bold">Unlock Gallery</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
