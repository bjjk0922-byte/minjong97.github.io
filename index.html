    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const BASE_CATEGORY_MAP = {
            'AI': ['영상', '이미지', 'GIF'],
            '촬영': ['사진', '영상'],
            '이미지': ['이미지'],
            '소스': ['촬영', 'AI', '촬영 + AI']
        };

        const extractDriveId = (url) => {
            if (!url) return null;
            const match = url.match(/(?:id=|file\/d\/)([a-zA-Z0-9_-]{25,})/);
            return match ? match[1] : null;
        };

        const processImageUrl = (url) => {
            const id = extractDriveId(url);
            if (id) {
                return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
            }
            return url || '';
        };

        const processVideoUrl = (url) => {
            const id = extractDriveId(url);
            if (id) {
                return `https://drive.google.com/file/d/${id}/preview`;
            }
            return url || '';
        };

        const App = () => {
            const loadInitialData = () => {
                try {
                    const dataScript = document.getElementById('app-data');
                    return JSON.parse(dataScript.textContent);
                } catch (e) {
                    return [];
                }
            };

            const [galleryData, setGalleryData] = useState(loadInitialData());
            const [searchTerm, setSearchTerm] = useState('');
            const [viewTab, setViewTab] = useState('video');
            const [mainCat, setMainCat] = useState('전체');
            const [subCat, setSubCat] = useState('전체');
            const [sortOrder, setSortOrder] = useState('newest');
            const [isScrolled, setIsScrolled] = useState(false);

            const [isEditorMode, setIsEditorMode] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState('');
            
            const [lightboxItem, setLightboxItem] = useState(null);
            
            const dragItemIndex = useRef(null);
            const dragOverItemIndex = useRef(null);
            const [draggedOverIndex, setDraggedOverIndex] = useState(null);

            useEffect(() => {
                setMainCat('전체');
                setSubCat('전체');
                setSearchTerm('');
            }, [viewTab]);

            const dynamicCategories = useMemo(() => {
                const map = {};
                const tabData = galleryData.filter(item => {
                    if (viewTab === 'video') return item.type === 'video';
                    return item.type === 'image' || item.type === 'photo';
                });

                tabData.forEach(item => {
                    const mCat = item.mainCategory || '미분류';
                    const sCat = item.subCategory || '미분류';
                    if (!map[mCat]) map[mCat] = new Set();
                    map[mCat].add(sCat);
                });
                const result = {};
                for (const key in map) {
                    result[key] = Array.from(map[key]).sort();
                }
                return result;
            }, [galleryData, viewTab]);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                if (lightboxItem || showLogin) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; };
            }, [lightboxItem, showLogin]);

            useEffect(() => {
                const handleKeyDown = (e) => { if (e.key === 'Escape') setLightboxItem(null); };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const resetFilters = () => {
                setSearchTerm('');
                setMainCat('전체');
                setSubCat('전체');
                setSortOrder('newest');
            };

            const filteredData = useMemo(() => {
                let data = galleryData.filter(item => {
                    if (viewTab === 'video') return item.type === 'video';
                    return item.type === 'image' || item.type === 'photo';
                });

                if (!isEditorMode) {
                    data = data.filter(item => {
                        const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                            item.description.toLowerCase().includes(searchTerm.toLowerCase());
                        const matchMain = mainCat === '전체' || item.mainCategory === mainCat;
                        const matchSub = subCat === '전체' || item.subCategory === subCat;
                        return matchSearch && matchMain && matchSub;
                    });
                }

                data.sort((a, b) => {
                    if (sortOrder === 'newest') return b.id - a.id;
                    if (sortOrder === 'oldest') return a.id - b.id;
                    if (sortOrder === 'name_asc') return a.title.localeCompare(b.title, 'ko-KR');
                    if (sortOrder === 'name_desc') return b.title.localeCompare(a.title, 'ko-KR');
                    return 0;
                });

                return data;
            }, [galleryData, searchTerm, mainCat, subCat, sortOrder, isEditorMode, viewTab]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === '@jjongkim0922') {
                    setIsEditorMode(true);
                    setShowLogin(false);
                    setPassword('');
                    alert('Welcome, Creator. 편집 모드가 활성화되었습니다.');
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            };

            const handleSaveHTML = () => {
                const clone = document.documentElement.cloneNode(true);
                const root = clone.querySelector('#root');
                if (root) root.innerHTML = '';
                
                const styleTags = clone.querySelectorAll('style');
                styleTags.forEach(style => {
                    if (style.id === 'tailwindcss-cdn-style' || style.textContent.includes('tailwindcss')) style.remove();
                });

                const dataScript = clone.querySelector('#app-data');
                if (dataScript) dataScript.textContent = '\n' + JSON.stringify(galleryData, null, 4) + '\n    ';

                const finalHTML = '<!DOCTYPE html>\n<html lang="ko">\n' + clone.innerHTML + '\n</html>';
                const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                a.download = `portfolio_archive_${dateStr}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const updateItem = (index, field, value) => {
                const newData = [...galleryData];
                newData[index][field] = value;
                setGalleryData(newData);
            };

            const updateLink = (index, value) => {
                const newData = [...galleryData];
                newData[index]['image'] = value;
                newData[index]['mediaUrl'] = value;
                setGalleryData(newData);
            };

            const addNewItem = () => {
                const newItem = {
                    id: Date.now(),
                    title: "",
                    description: "",
                    mainCategory: "미분류",
                    subCategory: "미분류",
                    date: new Date().toISOString().slice(0, 7).replace('-', '.'),
                    image: "",
                    mediaUrl: "",
                    type: viewTab 
                };
                setGalleryData([newItem, ...galleryData]);
            };

            const deleteItem = (index) => {
                if(confirm('이 항목을 정말 삭제하시겠습니까?')) {
                    const newData = [...galleryData];
                    newData.splice(index, 1);
                    setGalleryData(newData);
                }
            };

            const onDragStart = (index) => dragItemIndex.current = index;
            const onDragEnter = (index) => { dragOverItemIndex.current = index; setDraggedOverIndex(index); };
            const onDragEnd = () => {
                if (dragItemIndex.current !== null && dragOverItemIndex.current !== null && dragItemIndex.current !== dragOverItemIndex.current) {
                    const newData = [...galleryData];
                    const draggedItem = newData[dragItemIndex.current];
                    newData.splice(dragItemIndex.current, 1);
                    newData.splice(dragOverItemIndex.current, 0, draggedItem);
                    setGalleryData(newData);
                }
                dragItemIndex.current = null;
                dragOverItemIndex.current = null;
                setDraggedOverIndex(null);
            };

            const handleCardClick = (item) => {
                if (!isEditorMode) setLightboxItem(item);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans pb-20">
                    <datalist id="main-categories">
                        {Object.keys(dynamicCategories).map(cat => <option key={cat} value={cat} />)}
                    </datalist>

                    {/* 투명하고 미니멀한 헤더 */}
                    <header className={`fixed top-0 w-full z-40 transition-all duration-500 ${isScrolled || isEditorMode ? 'bg-white/90 backdrop-blur-md border-b border-slate-100 py-3 shadow-sm' : 'bg-transparent py-5 md:py-8'} ${isEditorMode ? 'mt-14' : ''}`}>
                        <div className="max-w-[1400px] mx-auto px-5 lg:px-10 flex flex-col items-center md:items-start">
                            <h1 className="text-2xl md:text-3xl font-trendy font-black tracking-tighter flex items-center gap-2 cursor-pointer" onClick={resetFilters}>
                                <span className="text-slate-900">WORKSPACE</span> <span className="bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-500">GALLERY</span>
                            </h1>
                            <p className="text-[10px] md:text-[11px] text-slate-400 font-outfit tracking-[0.3em] mt-1 font-bold">CREATIVE PORTFOLIO</p>
                        </div>
                    </header>

                    {isEditorMode && (
                        <div className="fixed top-0 left-0 w-full bg-slate-900 text-white px-5 md:px-8 py-3 flex justify-between items-center z-50 shadow-md text-xs md:text-sm">
                            <div className="flex items-center gap-2 font-bold truncate tracking-wide text-indigo-300">
                                <svg className="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                                <span className="hidden sm:inline">Editor Mode Active (드래그하여 순서를 마음대로 변경하세요)</span>
                                <span className="sm:hidden">Editor Mode</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={addNewItem} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 font-bold rounded-lg transition-colors flex items-center gap-1">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" /></svg>
                                    추가
                                </button>
                                <button onClick={() => setIsEditorMode(false)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 font-bold rounded-lg transition-colors">
                                    종료
                                </button>
                                <button onClick={handleSaveHTML} className="px-4 py-1.5 bg-gradient-to-r from-brand-primary to-brand-accent hover:opacity-90 font-bold rounded-lg shadow-lg flex items-center gap-1.5 transition-opacity">
                                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                                    <span className="hidden sm:inline">저장하고 배포하기</span>
                                    <span className="sm:hidden">저장</span>
                                </button>
                            </div>
                        </div>
                    )}

                    <main className={`flex-grow max-w-[1400px] mx-auto px-5 lg:px-10 w-full ${isEditorMode ? 'pt-32' : 'pt-36 md:pt-44'}`}>
                        
                        {/* ★ 미니멀 갤러리 탭 스위처 & 컨트롤 바 */}
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-8 md:mb-12 border-b border-slate-200 pb-2 gap-4">
                            
                            {/* 심플 텍스트 탭 */}
                            <div className="flex gap-6 md:gap-10">
                                <button 
                                    onClick={() => setViewTab('video')} 
                                    className={`text-2xl md:text-3xl font-black tracking-tight transition-colors relative pb-2 ${viewTab === 'video' ? 'text-slate-900' : 'text-slate-300 hover:text-slate-500'}`}
                                >
                                    영상
                                    {viewTab === 'video' && <div className="absolute bottom-[-3px] left-0 w-full h-1 bg-slate-900 rounded-t-full"></div>}
                                </button>
                                <button 
                                    onClick={() => setViewTab('image')} 
                                    className={`text-2xl md:text-3xl font-black tracking-tight transition-colors relative pb-2 ${viewTab === 'image' ? 'text-slate-900' : 'text-slate-300 hover:text-slate-500'}`}
                                >
                                    이미지 & GIF
                                    {viewTab === 'image' && <div className="absolute bottom-[-3px] left-0 w-full h-1 bg-slate-900 rounded-t-full"></div>}
                                </button>
                            </div>

                            {/* 슬림화된 우측 컨트롤 (검색 & 정렬) */}
                            {!isEditorMode && (
                                <div className="flex items-center justify-between md:justify-end gap-5 w-full md:w-auto pt-2 md:pt-0">
                                    <div className="relative w-full md:w-48 group">
                                        <svg className="absolute left-0 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                                        <input 
                                            type="text" 
                                            className="w-full bg-transparent border-none pl-6 pr-2 py-1 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-0" 
                                            placeholder="Search..." 
                                            value={searchTerm} 
                                            onChange={(e) => setSearchTerm(e.target.value)} 
                                        />
                                        <div className="absolute bottom-0 left-0 w-full h-px bg-slate-200 group-focus-within:bg-slate-800 transition-colors"></div>
                                    </div>
                                    <div className="w-px h-4 bg-slate-300 hidden md:block"></div>
                                    <div className="relative shrink-0">
                                        <select 
                                            value={sortOrder} 
                                            onChange={(e) => setSortOrder(e.target.value)}
                                            className="appearance-none bg-transparent text-slate-500 font-bold text-sm pr-4 focus:outline-none hover:text-slate-900 cursor-pointer transition-colors"
                                        >
                                            <option value="newest">최신순</option>
                                            <option value="oldest">오래된순</option>
                                            <option value="name_asc">가나다순</option>
                                        </select>
                                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center text-slate-400">
                                            <svg className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* ★ 텍스트 위주의 세련된 필터 라인 */}
                        {!isEditorMode && (
                            <div className="mb-10 space-y-4">
                                <div className="flex gap-6 overflow-x-auto hide-scrollbar pb-2">
                                    <button 
                                        onClick={() => { setMainCat('전체'); setSubCat('전체'); }}
                                        className={`whitespace-nowrap text-sm md:text-base transition-all ${mainCat === '전체' ? 'text-slate-900 font-bold border-b-2 border-slate-900 pb-1' : 'text-slate-400 font-medium pb-1 hover:text-slate-700'}`}
                                    >
                                        전체보기
                                    </button>
                                    {Object.keys(dynamicCategories).filter(k => k !== '미분류' || galleryData.some(i => i.mainCategory === '미분류')).sort().map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => { setMainCat(cat); setSubCat('전체'); }}
                                            className={`whitespace-nowrap text-sm md:text-base transition-all ${mainCat === cat ? 'text-slate-900 font-bold border-b-2 border-slate-900 pb-1' : 'text-slate-400 font-medium pb-1 hover:text-slate-700'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                
                                {mainCat !== '전체' && dynamicCategories[mainCat] && (
                                    <div className="flex gap-2 overflow-x-auto hide-scrollbar animate-in fade-in slide-in-from-top-1 duration-300">
                                        <button 
                                            onClick={() => setSubCat('전체')}
                                            className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 ${subCat === '전체' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800'}`}
                                        >
                                            타입 전체
                                        </button>
                                        {dynamicCategories[mainCat].map(sub => (
                                            <button 
                                                key={sub} 
                                                onClick={() => setSubCat(sub)}
                                                className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 ${subCat === sub ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800'}`}
                                            >
                                                {sub}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ★ Empty State (빈 화면 처리) */}
                        {filteredData.length === 0 && !isEditorMode && (
                            <div className="col-span-full flex flex-col items-center justify-center py-20 md:py-32 animate-in fade-in zoom-in-95 duration-500">
                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-5">
                                    <svg className="w-8 h-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-2">조건에 맞는 작업물이 없습니다</h3>
                                <p className="text-slate-400 text-sm mb-8 text-center px-4">다른 카테고리나 검색어를 시도해 보세요.</p>
                                <button 
                                    onClick={resetFilters} 
                                    className="px-6 py-2.5 bg-transparent border border-slate-300 text-slate-600 font-bold text-sm rounded-full hover:bg-slate-50 hover:text-slate-900 transition-all flex items-center gap-2"
                                >
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                    필터 초기화
                                </button>
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10 xl:gap-12">
                            
                            {isEditorMode && (
                                <div 
                                    onClick={addNewItem}
                                    className="group cursor-pointer flex flex-col items-center justify-center bg-transparent rounded-xl border border-dashed border-slate-300 hover:border-slate-500 hover:bg-slate-50 transition-all duration-300 min-h-[380px]"
                                >
                                    <div className="w-12 h-12 bg-slate-800 text-white rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>
                                    </div>
                                    <h3 className="text-slate-800 font-bold text-lg">새 작품 추가</h3>
                                </div>
                            )}

                            {filteredData.map((item, index) => {
                                const realIndex = galleryData.findIndex(g => g.id === item.id);
                                
                                return (
                                    <div 
                                        key={item.id} 
                                        draggable={isEditorMode}
                                        onDragStart={() => isEditorMode && onDragStart(realIndex)}
                                        onDragEnter={() => isEditorMode && onDragEnter(realIndex)}
                                        onDragEnd={isEditorMode ? onDragEnd : undefined}
                                        onDragOver={(e) => e.preventDefault()}
                                        onClick={() => handleCardClick(item)}
                                        className={`animate-item group relative flex flex-col bg-white rounded-xl overflow-hidden transition-all duration-500 ease-out ${
                                            isEditorMode ? 'cursor-grab active:cursor-grabbing border border-slate-200 hover:border-slate-400' : 'cursor-pointer shadow-sm hover:shadow-2xl hover:shadow-slate-200/50 hover:-translate-y-2'
                                        } ${draggedOverIndex === realIndex ? 'drag-over' : ''}`}
                                        style={{ animationDelay: `${index * 0.05}s` }}
                                    >
                                        {isEditorMode && (
                                            <div className="absolute top-4 left-4 z-20 bg-white/90 backdrop-blur-md p-2 rounded-lg text-slate-400 cursor-grab active:cursor-grabbing flex gap-2 shadow-sm border border-slate-100">
                                                <svg className="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                                                <div className="w-px bg-slate-200"></div>
                                                <button onClick={(e) => { e.stopPropagation(); deleteItem(realIndex); }} className="text-rose-500 hover:text-rose-600" title="삭제">
                                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                </button>
                                            </div>
                                        )}

                                        <div className="relative aspect-[4/3] overflow-hidden bg-slate-50">
                                            <div className="absolute inset-0 z-10 w-full h-full bg-transparent"></div>
                                            
                                            <img 
                                                src={processImageUrl(item.image)} alt={item.title} loading="lazy"
                                                className={`w-full h-full object-cover transition-transform duration-700 pointer-events-none ${!isEditorMode && 'group-hover:scale-105'}`}
                                            />
                                            
                                            {!isEditorMode && item.type === 'video' && (
                                                <div className="absolute top-4 right-4 md:top-5 md:right-5 bg-white/90 backdrop-blur-md w-8 h-8 rounded-full flex items-center justify-center text-slate-800 z-0 shadow-sm transition-transform group-hover:scale-110">
                                                    <svg className="w-3 h-3 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                </div>
                                            )}
                                            {!isEditorMode && (item.subCategory?.includes('GIF') || (item.type === 'image' && item.mediaUrl?.includes('drive') && item.subCategory?.includes('상세페이지'))) && (
                                                <div className="absolute top-4 right-4 md:top-5 md:right-5 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-md text-[10px] md:text-[11px] font-black text-slate-800 tracking-widest z-0 shadow-sm">GIF</div>
                                            )}
                                        </div>

                                        {/* ★ 미니멀해진 카드 텍스트 영역 */}
                                        <div className="p-6 flex flex-col flex-grow z-10 bg-white">
                                            {isEditorMode ? (
                                                <div className="space-y-3" onClick={e => e.stopPropagation()}>
                                                    <div className="flex gap-2">
                                                        <select value={item.type || 'image'} onChange={(e) => updateItem(realIndex, 'type', e.target.value)} className="bg-slate-50 border border-slate-200 text-xs font-bold text-slate-800 rounded-lg px-3 py-2 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 w-1/3 shrink-0">
                                                            <option value="image">이미지</option>
                                                            <option value="photo">사진</option>
                                                            <option value="video">비디오</option>
                                                        </select>
                                                        <input type="text" value={item.mediaUrl || item.image || ''} onChange={(e) => updateLink(realIndex, e.target.value)} placeholder="구글 드라이브 공유 링크 (이미지/영상)" className="w-2/3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-[11px] text-slate-800 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800" />
                                                    </div>
                                                    
                                                    <div className="flex gap-2">
                                                        <input 
                                                            type="text" 
                                                            list="main-categories"
                                                            value={item.mainCategory} 
                                                            onChange={(e) => updateItem(realIndex, 'mainCategory', e.target.value)} 
                                                            className="bg-slate-50 border border-slate-200 text-xs font-bold text-slate-800 rounded-lg px-3 py-2 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 w-1/2" 
                                                            placeholder="대분류 입력" 
                                                        />
                                                        
                                                        <datalist id={`sub-categories-${realIndex}`}>
                                                            {(dynamicCategories[item.mainCategory] || []).map(sub => <option key={sub} value={sub} />)}
                                                        </datalist>
                                                        
                                                        <input 
                                                            type="text" 
                                                            list={`sub-categories-${realIndex}`}
                                                            value={item.subCategory} 
                                                            onChange={(e) => updateItem(realIndex, 'subCategory', e.target.value)} 
                                                            className="bg-slate-50 border border-slate-200 text-xs font-bold text-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 w-1/2" 
                                                            placeholder="소분류 입력" 
                                                        />
                                                    </div>
                                                    
                                                    <input type="text" value={item.title} onChange={(e) => updateItem(realIndex, 'title', e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-900 font-bold focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 placeholder-slate-400" placeholder="멋진 제목을 지어주세요" />
                                                    <textarea value={item.description} rows="4" onChange={(e) => updateItem(realIndex, 'description', e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-600 focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 resize-y hide-scrollbar placeholder-slate-400 min-h-[100px]" placeholder="작업 상세 내용을 기록하세요" />
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="flex items-center gap-2 mb-3">
                                                        <span className="text-[10px] md:text-[11px] font-black text-slate-800 uppercase tracking-widest">{item.mainCategory}</span>
                                                        <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                                        <span className="text-[10px] md:text-[11px] font-medium text-slate-400">{item.subCategory}</span>
                                                    </div>
                                                    <h3 className="text-lg md:text-xl font-bold text-slate-900 mb-2 leading-snug line-clamp-2 transition-colors">{item.title}</h3>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* ★ 통합 모달 */}
                    {lightboxItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-8 bg-slate-900/90 backdrop-blur-md transition-all" onClick={() => setLightboxItem(null)}>
                            
                            <div 
                                className="relative w-full max-w-[1200px] max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row animate-in fade-in zoom-in-95 duration-200"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <button 
                                    onClick={() => setLightboxItem(null)} 
                                    className="absolute top-4 right-4 md:top-6 md:right-6 z-50 p-2.5 bg-black/10 hover:bg-black/20 text-slate-800 md:text-white md:bg-black/30 md:hover:bg-black/50 backdrop-blur-md rounded-full transition-all"
                                >
                                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>

                                <div className="relative w-full md:w-[65%] bg-black flex items-center justify-center min-h-[35vh] md:min-h-[60vh] max-h-[50vh] md:max-h-full overflow-hidden">
                                    {lightboxItem.type === 'video' ? (
                                        <div className="w-full h-full relative overflow-hidden">
                                            <iframe 
                                                src={processVideoUrl(lightboxItem.mediaUrl || lightboxItem.image)} 
                                                className="absolute left-0 border-0 w-full"
                                                style={{ top: '-65px', height: 'calc(100% + 65px)' }}
                                                allow="autoplay; fullscreen"
                                                allowFullScreen
                                                sandbox="allow-scripts allow-same-origin"
                                            ></iframe>
                                        </div>
                                    ) : (
                                        <img 
                                            src={processImageUrl(lightboxItem.mediaUrl || lightboxItem.image)} 
                                            alt={lightboxItem.title} 
                                            className="w-full h-full object-contain"
                                        />
                                    )}
                                </div>

                                <div className="w-full md:w-[35%] p-8 md:p-12 flex flex-col bg-white overflow-y-auto max-h-[45vh] md:max-h-full hide-scrollbar">
                                    <div className="flex items-center gap-2 mb-6">
                                        <span className="text-xs md:text-sm font-black text-slate-800 uppercase tracking-widest">{lightboxItem.mainCategory}</span>
                                        <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                        <span className="text-xs md:text-sm font-medium text-slate-500">{lightboxItem.subCategory}</span>
                                    </div>
                                    
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-900 mb-6 leading-tight tracking-tight">
                                        {lightboxItem.title}
                                    </h2>
                                    
                                    <div className="w-8 h-1 bg-slate-200 mb-6"></div>
                                    
                                    <div className="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-line break-keep font-medium">
                                        {lightboxItem.description}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 right-0 w-20 h-20 opacity-0 hover:opacity-100 cursor-pointer z-50 flex items-end justify-end p-4 transition-opacity duration-300" onClick={() => setShowLogin(true)}>
                        <div className="w-3 h-3 bg-slate-300 rounded-full shadow-sm hover:scale-150 transition-transform"></div>
                    </div>

                    {showLogin && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-5">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={() => setShowLogin(false)}></div>
                            <div className="relative bg-white p-10 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-300 rounded-2xl">
                                <div className="w-12 h-12 bg-slate-900 rounded-full mb-6 mx-auto flex items-center justify-center shadow-lg">
                                    <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                </div>
                                <h3 className="text-center text-slate-900 font-trendy font-black text-xl mb-8 tracking-widest">CURATOR ACCESS</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 text-slate-900 text-center tracking-[0.7em] font-black focus:ring-2 focus:ring-slate-800 outline-none mb-6 text-xl placeholder-slate-300 appearance-none" placeholder="••••" autoFocus />
                                    <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white py-4 rounded-xl font-bold text-sm transition-all duration-300 shadow-lg active:scale-95">ENTER</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
