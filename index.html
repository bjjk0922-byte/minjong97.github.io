        };

        const processImageUrl = (url) => {
            if (!url) return '';
            if (url.includes('thumbnail?id=')) return url;
            
            let fileId = '';
            const regex1 = /file\/d\/([a-zA-Z0-9_-]+)/;
            const regex2 = /[?&]id=([a-zA-Z0-9_-]+)/;
            
            if (url.match(regex1)) fileId = url.match(regex1)[1];
            else if (url.match(regex2)) fileId = url.match(regex2)[1];

            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1920`;
            }
            return url;
        };

        const extractDriveId = (url) => {
            if (!url) return null;
            const regex1 = /file\/d\/([a-zA-Z0-9_-]+)/;

                let filtered = baseData.filter(item => {
                    const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||

                    const matchMain = mainCat === '전체' || item.mainCategory === mainCat;
                    const matchSub = subCat === '전체' || item.subCategory === subCat;
                    return matchSearch && matchMain && matchSub;

                    if (sortOption === 'videoFirst') {
                        filtered.sort((a, b) => {
                            const isVideoA = (a.type === 'video' || a.subCategory === '영상');
                            const isVideoB = (b.type === 'video' || b.subCategory === '영상');
                            
                            const getPriority = (item, isVideo) => {
                                if (item.mainCategory === '소스') return 100;
                                if (isVideo) {
                                    if (item.mainCategory === '촬영') return 1;
                                    if (item.mainCategory === 'AI') return 2;
                                    return 3;
                                }
                                return 50;
                            };

                            const priorityA = getPriority(a, isVideoA);
                            const priorityB = getPriority(b, isVideoB);

                            if (priorityA !== priorityB) {
                                return priorityA - priorityB;
                            }
                            
                            return a.originalIndex - b.originalIndex;
                        });
                    } else if (sortOption === 'imageFirst') {
                        filtered.sort((a, b) => {
                            const isImageA = (a.type === 'image' || a.type === 'photo' || a.subCategory === '이미지' || a.subCategory === '사진' || a.subCategory === 'GIF');
                            const isImageB = (b.type === 'image' || b.type === 'photo' || b.subCategory === '이미지' || b.subCategory === '사진' || b.subCategory === 'GIF');
                            
                            const getPriority = (item, isImage) => {
                                if (item.mainCategory === '소스') return 100;
                                if (isImage) return 1;
                                return 50;
                            };

                            const priorityA = getPriority(a, isImageA);
                            const priorityB = getPriority(b, isImageB);

                            if (priorityA !== priorityB) {
                                return priorityA - priorityB;
                            }
                            
                            return a.originalIndex - b.originalIndex;
                        });

                                                            value={item.subCategory} 
                                                            onChange={(e) => updateItem(realIndex, 'subCategory', e.target.value)} 
                                                            className="bg-transparent border-b border-zinc-200 text-[11px] font-bold text-zinc-600 px-2 py-1.5 focus:outline-none focus:border-brand-primary w-1/2" 
                                                            placeholder="소분류" 
                                                        />
                                                    </div>
                                                    
                                                    <input type="text" value={item.title} onChange={(e) => updateItem(realIndex, 'title', e.target.value)} className="w-full bg-transparent border-b border-zinc-200 px-2 py-2 text-sm text-zinc-900 font-black focus:outline-none focus:border-brand-primary placeholder-zinc-400" placeholder="제목" />
                                                    <textarea value={item.description} rows="3" onChange={(e) => updateItem(realIndex, 'description', e.target.value)} className="w-full bg-transparent border-b border-zinc-200 px-2 py-2 text-[11px] text-zinc-500 focus:outline-none focus:border-brand-primary resize-y hide-scrollbar placeholder-zinc-400 min-h-[60px] leading-relaxed" placeholder="설명" />
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="flex flex-col gap-1.5 mb-3">
                                                        <div className="flex gap-2 items-center flex-wrap">
                                                            <span className={`px-2 py-0.5 rounded text-[9px] font-black tracking-[0.1em] uppercase ${item.mainCategory === '미분류' ? 'bg-rose-100 text-rose-600' : 'bg-brand-primary/10 text-brand-primary'}`}>{item.mainCategory}</span>
                                                            <span className={`px-2 py-0.5 rounded text-[9px] font-bold tracking-widest uppercase ${item.subCategory === '미분류' ? 'bg-rose-50 text-rose-500' : 'bg-zinc-100 text-zinc-600'}`}>{item.subCategory}</span>
                                                        </div>
                                                    </div>
                                                    <h3 className="text-sm md:text-base font-black text-zinc-900 mb-2 leading-tight group-hover:text-brand-primary transition-colors duration-300 line-clamp-2">{item.title}</h3>
                                                    <p className="text-[11px] md:text-xs text-zinc-500 line-clamp-3 leading-relaxed mt-auto">{item.description}</p>
                                                    
                                                    <div className="mt-4 pt-4 flex justify-end items-center border-t border-zinc-100">
                                                        <span className="text-brand-primary font-bold opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
                                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
                                                        </span>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* 면책 조항(저작권 동의) 모달 - 최초 접속 시 노출 */}
                    {showDisclaimer && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-zinc-900/90 backdrop-blur-lg"></div>
                            <div className="relative bg-white p-8 md:p-12 border border-zinc-200 shadow-2xl w-full max-w-lg rounded-[2rem]">
                                <div className="w-12 h-12 bg-red-50 text-brand-accent rounded-full mb-6 mx-auto flex items-center justify-center">
                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                </div>
                                <h3 className="text-center text-zinc-900 font-black text-xl mb-4 tracking-tight">포트폴리오 열람 안내</h3>
                                <div className="text-sm text-zinc-600 space-y-3 leading-relaxed mb-8 bg-zinc-50 p-4 rounded-xl">
                                    <p>본 사이트는 <strong>개인 포트폴리오 및 역량 증명</strong>을 위한 목적으로만 제작되었습니다.</p>
                                    <p>수록된 모든 작업물(영상, 이미지 등)의 저작권 및 소유권은 <strong>해당 프로젝트를 진행한 원소속 기업 및 협력사</strong>에 귀속되어 있습니다.</p>
                                    <p className="text-rose-500 font-bold">평가 목적 외 상업적 목적의 사용이나 무단 캡처, 배포를 엄격히 금지합니다.</p>
                                </div>
                                <button onClick={() => setShowDisclaimer(false)} className="w-full bg-zinc-900 hover:bg-brand-primary text-white py-4 rounded-xl font-bold text-sm transition-colors shadow-lg active:scale-95">
                                    위 내용을 확인했으며, 열람에 동의합니다
                                </button>
                            </div>
                        </div>
                    )}

                    {lightboxItem && (
                        <div 
                            className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-10 bg-zinc-900/95 backdrop-blur-xl"
                            onClick={() => setLightboxItem(null)}
                        >
                            <button className="absolute top-4 right-4 md:top-8 md:right-8 z-[110] p-2.5 md:p-3 text-zinc-400 hover:text-white bg-zinc-800 hover:bg-brand-primary rounded-full transition-all shadow-sm">
                                <svg className="w-6 h-6 md:w-8 md:h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>

                            <div 
                                className="relative w-full max-w-6xl max-h-full flex flex-col md:flex-row bg-[#0a0a0a] rounded-[2rem] overflow-hidden shadow-2xl border border-zinc-800"
                                onClick={(e) => e.stopPropagation()}
                            >
                                {/* 좌측 미디어 영역 (70%) */}
                                <div className="w-full md:w-[70%] bg-black relative flex items-center justify-center min-h-[40vh] md:min-h-[60vh]">
                                    {lightboxItem.type === 'video' ? (
                                        <div className="relative w-full h-full flex flex-col items-center justify-center overflow-hidden">
                                            {extractDriveId(lightboxItem.mediaUrl || lightboxItem.image) ? (
                                                <iframe
                                                    src={getDrivePreviewUrl(lightboxItem.mediaUrl || lightboxItem.image)}
                                                    className="absolute inset-0 w-full h-full min-h-[40vh] border-0"
                                                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                                                    allowFullScreen
                                                    loading="eager"
                                                    referrerPolicy="strict-origin-when-cross-origin"
                                                    title={lightboxItem.title}
                                                ></iframe>
                                            ) : (
                                                <video
                                                    key={lightboxItem.id}
                                                    controls
                                                    controlsList="nodownload noremoteplayback noplaybackrate"
                                                    disablePictureInPicture
                                                    playsInline
                                                    preload="metadata"
                                                    webkit-playsinline="true"
                                                    className="w-full h-full object-contain"
                                                    onError={() => setVideoError(true)}
                                                >
                                                    <source src={processVideoUrl(lightboxItem.mediaUrl || lightboxItem.image)} />
                                                    브라우저가 비디오 재생을 지원하지 않습니다.
                                                </video>
                                            )}
                                        </div>
                                    ) : (
                                        <img 
                                            src={processImageUrl(lightboxItem.mediaUrl || lightboxItem.image)} 
                                            alt={lightboxItem.title} 
                                            className="w-full h-full object-contain p-4"
                                        />
                                    )}
                                </div>

                                {/* 우측 설명 영역 (30%) */}
                                <div className="w-full md:w-[30%] p-6 md:p-8 lg:p-10 flex flex-col overflow-y-auto bg-[#111111]">
                                    <div className="flex flex-col gap-2 mb-6">
                                        <div className="flex gap-2 items-center flex-wrap">
                                            <span className="bg-brand-primary/10 text-brand-primary px-2.5 py-1 rounded-md text-[10px] font-black tracking-[0.2em] uppercase">
                                                {lightboxItem.mainCategory}
                                            </span>
                                            <span className="bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-md text-[10px] font-bold tracking-[0.2em] uppercase">
                                                {lightboxItem.subCategory}
                                            </span>
                                        </div>
                                    </div>
                                    <h2 className="text-2xl md:text-3xl font-black text-white mb-6 tracking-tight leading-tight">{lightboxItem.title}</h2>
                                    
                                    <div className="h-px w-full bg-zinc-800 mb-6"></div>
                                    
                                    <p className="text-zinc-400 text-sm md:text-base leading-relaxed whitespace-pre-line font-medium flex-grow">
                                        {lightboxItem.description}
                                    </p>
                                    
                                    {lightboxItem.type === 'video' && videoError && (
                                        <div className="mt-8 p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl">
                                            <p className="text-rose-400 text-[10px] md:text-xs text-center mb-3">
                                                현재 브라우저에서 직접 재생할 수 없습니다. 아래 버튼으로 영상을 열어주세요.
                                            </p>
                                            <a
                                                href={processVideoUrl(lightboxItem.mediaUrl || lightboxItem.image)}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="block w-full text-center bg-white/10 hover:bg-white/20 text-white py-2.5 rounded-lg text-xs font-bold transition-colors"
                                                onClick={(e) => e.stopPropagation()}
                                            >
                                                영상 새 창에서 재생
                                            </a>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 right-0 w-16 h-16 md:w-20 md:h-20 opacity-0 hover:opacity-100 cursor-pointer z-50 flex items-end justify-end p-4 transition-opacity duration-300" onClick={() => setShowLogin(true)}>
                        <div className="w-3 h-3 bg-brand-primary rounded-full shadow-lg hover:scale-125 transition-transform"></div>
                    </div>

                    {showLogin && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-zinc-900/60 backdrop-blur-md" onClick={() => setShowLogin(false)}></div>
                            <div className="relative bg-white p-6 sm:p-8 md:p-10 border border-brand-primary/20 shadow-2xl w-full max-w-sm animate-in zoom-in-95 duration-200 rounded-[2.5rem]">
                                <h3 className="text-center text-brand-primary font-trendy text-lg sm:text-xl mb-6 md:mb-8 uppercase tracking-widest font-black">Curator Access</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-zinc-100 border-none rounded-2xl p-3 sm:p-4 text-zinc-900 text-center tracking-[0.5em] font-black focus:ring-2 focus:ring-brand-primary focus:bg-white outline-none mb-5 md:mb-6 text-lg sm:text-xl placeholder-zinc-400 appearance-none shadow-inner transition-all" placeholder="••••" autoFocus />
                                    <button type="submit" className="w-full bg-zinc-900 hover:bg-brand-primary text-white py-3 sm:py-4 rounded-2xl font-trendy font-bold text-xs sm:text-sm transition-colors uppercase tracking-[0.2em] shadow-lg active:scale-95">Unlock Gallery</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 영구적인 하단 저작권 고지 영역 */}
                    <footer className="w-full py-8 mt-12 border-t border-zinc-200 text-center">
                        <div className="max-w-4xl mx-auto px-6 text-zinc-400 text-[10px] md:text-xs font-medium leading-loose">
                            <p>본 포트폴리오에 수록된 작업물의 소유권 및 저작권은 원소속 기업 및 브랜드에 귀속되어 있습니다.</p>
                            <p>본 사이트는 채용 평가 및 개인 역량 증명을 위한 용도로만 제공되며, 무단 캡처 및 상업적 사용을 엄격히 금합니다.</p>
                            <p className="mt-4 font-outfit text-zinc-500">© {new Date().getFullYear()} MinJong Kim. All rights restricted to original copyright holders.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>



</body>
</html>
